<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Admin Login - M.Y.D. Portfolio</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#5d4201",
                        "surface-container-low": "#f3f4f5",
                        "on-secondary-container": "#785a1a",
                        "on-error": "#ffffff",
                        "surface-container": "#edeeef",
                        "inverse-surface": "#2e3132",
                        "error": "#ba1a1a",
                        "on-surface": "#191c1d",
                        "surface-tint": "#5f5e5e",
                        "surface": "#f8f9fa",
                        "outline": "#747878",
                        "surface-dim": "#d9dadb",
                        "on-surface-variant": "#444748",
                        "inverse-primary": "#c8c6c5",
                        "background": "#f8f9fa",
                        "outline-variant": "#c4c7c7",
                        "secondary": "#775a19",
                        "secondary-container": "#fed488",
                        "on-secondary-fixed": "#261900",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#e7e8e9",
                        "on-tertiary-fixed-variant": "#3f484f",
                        "primary": "#000000",
                        "surface-variant": "#e1e3e4",
                        "tertiary-container": "#141d23",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#141d23",
                        "primary-fixed-dim": "#c8c6c5",
                        "surface-bright": "#f8f9fa",
                        "primary-container": "#1c1b1b",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#858383",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f0f1f2",
                        "on-primary-fixed-variant": "#474746",
                        "tertiary": "#000000",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#e5e2e1",
                        "on-primary-fixed": "#1c1b1b",
                        "secondary-fixed": "#ffdea5",
                        "tertiary-fixed-dim": "#bfc8d0",
                        "on-background": "#191c1d",
                        "surface-container-highest": "#e1e3e4",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#7c858d",
                        "secondary-fixed-dim": "#e9c176",
                        "tertiary-fixed": "#dbe4ed"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "80px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "margin-mobile": "20px",
                        "container-max": "1440px",
                        "gutter": "24px",
                        "section-gap": "120px",
                        "stack-lg": "32px"
                    },
                    "fontFamily": {
                        "display-lg": ["Space Grotesk"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Space Grotesk"],

                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }]

                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.4) 100%);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
        }

        .btn-gradient {
            background: linear-gradient(to right, #1A1A1A, #333333);
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            box-shadow: 0 0 15px rgba(119, 90, 25, 0.5);
            /* Champagne Gold glow */
        }

        .input-glass {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid transparent;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .input-glass:focus {
            outline: none;
            border-bottom: 2px solid #775a19;
            /* secondary/champagne gold */
            background: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>

<body
    class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
    <!-- Ambient Background Elements to enhance minimal aesthetic -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-secondary-fixed/20 blur-[100px]">
        </div>
        <div
            class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-surface-variant/50 blur-[120px]">
        </div>
    </div>
    <!-- Login Container -->
    <main class="w-full max-w-md mx-auto">
        <!-- Header/Brand Area -->
        <div class="text-center mb-stack-lg">
            <h1 class="font-headline-lg text-headline-lg text-primary tracking-tighter mb-stack-sm">M.Y.D.</h1>
            <p class="font-body-md text-body-md text-on-surface-variant">Admin Portal</p>
        </div>
        <!-- Glassmorphic Login Card -->
        <div
            class="glass-card rounded-xl p-8 md:p-10 relative group transition-all duration-500 hover:backdrop-blur-3xl">
            <form class="flex flex-col gap-stack-lg">
                <!-- Email Input -->
                <div class="flex flex-col gap-stack-sm">
                    <label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2"
                        for="email">
                        <span class="material-symbols-outlined text-[18px]">mail</span>
                        Email Address
                    </label>
                    <input
                        class="input-glass w-full px-4 py-3 rounded-lg font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50"
                        id="email" name="email" placeholder="admin@example.com" required="" type="email" />
                </div>
                <!-- Password Input -->
                <div class="flex flex-col gap-stack-sm">
                    <label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2"
                        for="password">
                        <span class="material-symbols-outlined text-[18px]">lock</span>
                        Password
                    </label>
                    <input
                        class="input-glass w-full px-4 py-3 rounded-lg font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50"
                        id="password" name="password" placeholder="••••••••" required="" type="password" />
                </div>
                <!-- Submit Button -->
                <button
                    class="btn-gradient w-full py-4 rounded-full font-label-md text-label-md text-on-primary flex items-center justify-center gap-2 mt-stack-sm"
                    type="submit">
                    Access Dashboard
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                </button>
            </form>
            <!-- Back to Home Link -->
            <div class="mt-stack-lg text-center">
                <a class="font-label-md text-label-md text-on-surface-variant hover:text-secondary transition-colors duration-300 flex items-center justify-center gap-2 inline-flex"
                    href="#">
                    <span class="material-symbols-outlined text-[16px]">arrow_back</span>
                    Return to Portfolio
                </a>
            </div>
        </div>
    </main>
</body>

</html>
